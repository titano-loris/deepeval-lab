[pytest]
testpaths = tests
python_files = test_*.py

markers =
    unit: tests rapides sans modele (robustesse JSON du juge)
    judge: tests utilisant le juge local LLM-as-Judge
    slow: tests lents necessitant le chargement du LLM

addopts =
    -v
    --tb=short
    --strict-markers

# Usage :
#   pytest -m unit     -> tests rapides (~5s)
#   pytest -m judge    -> evaluation complete LLM-as-Judge (~20-40 min CPU)
#   pytest -m judge --html=reports/judge-report.html --self-contained-html
